<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ведущий – Зефирные космолёты</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/common.js"></script>
    <style>
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 700px) { .admin-grid { grid-template-columns: 1fr; } }
        .team-table td, .team-table th { padding: 6px 8px; font-size: .88rem; }
        .action-item { background: #1a2250; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
        .action-buttons { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .score-input { width: 60px; }
        .phase-badge { display: inline-block; padding: 4px 14px; border-radius: 999px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="wrap" id="app">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h1>🛸 Панель ведущего</h1>
            <div>
                <button class="ghost" onclick="openRules()">📖 Правила</button>
                <button class="danger" id="resetBtn" style="margin-left:8px;">🔄 Сбросить игру</button>
            </div>
        </div>
        <div id="adminPanel" style="display:none;">
            <div class="card" style="margin-bottom:16px;">
                <div class="row">
                    <span><strong>Код комнаты:</strong> <span id="roomCodeDisplay"></span></span>
                    <span><strong>Раунд:</strong> <span id="roundDisplay">0</span> / <span id="totalRoundsDisplay">5</span></span>
                    <span class="phase-badge" id="phaseBadge">Ожидание</span>
                </div>
                <div class="row" style="margin-top:12px; gap:8px; flex-wrap:wrap;">
                    <button id="startBtn" class="mint">▶ Начать игру</button>
                    <button id="nextPhaseBtn" class="secondary">⏩ Следующая фаза</button>
                </div>
            </div>

            <div class="admin-grid">
                <div class="card">
                    <h3>Команды</h3>
                    <div id="teamsContainer"><p class="muted">Нет команд</p></div>
                    <div id="scoreSection" style="margin-top:12px; display:none;">
                        <h4>Начислить очки</h4>
                        <div id="scoreInputs"></div>
                        <button id="applyScoreBtn" class="yellow" style="margin-top:8px;">✅ Применить очки</button>
                        <div id="scoreMsg" class="muted"></div>
                    </div>
                </div>
                <div class="card">
                    <h3>Действия команд</h3>
                    <div id="actionsContainer"><p class="muted">Нет действий</p></div>
                </div>
            </div>

            <div class="card" style="margin-top:16px;">
                <h3>История игры</h3>
                <div id="historyContainer" class="history-box"><p class="muted">Пусто</p></div>
            </div>
        </div>

        <!-- Начальная форма создания/загрузки -->
        <div id="setupPanel" class="card stack" style="max-width:400px;">
            <input type="text" id="adminRoomInput" placeholder="Код комнаты (для загрузки)" maxlength="5" style="text-transform:uppercase;" />
            <input type="text" id="adminTokenInput" placeholder="Токен ведущего (для загрузки)" />
            <div class="row">
                <button id="createGameBtn" style="flex:1;">✨ Создать игру</button>
                <button id="loadGameBtn" class="secondary" style="flex:1;">📂 Загрузить</button>
            </div>
            <div id="adminMsg" class="muted"></div>
        </div>
    </div>

    <script>
        // ---- состояние ----
        let gameState = null;
        let ws = null;

        const roomCodeSpan = document.getElementById('roomCodeDisplay');
        const roundDisplay = document.getElementById('roundDisplay');
        const totalRoundsDisplay = document.getElementById('totalRoundsDisplay');
        const phaseBadge = document.getElementById('phaseBadge');
        const teamsContainer = document.getElementById('teamsContainer');
        const actionsContainer = document.getElementById('actionsContainer');
        const historyContainer = document.getElementById('historyContainer');
        const scoreSection = document.getElementById('scoreSection');
        const scoreInputs = document.getElementById('scoreInputs');
        
// ---- опрос состояния (polling) ----
let pollInterval = null;

function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');
        const token = params.get('token');
        if (!room || !token) return;
        try {
            const data = await apiGet(`/api/games/${room}/state?token=${token}&role=admin`);
            if (data.type === 'state') {
                gameState = data;
                render();
            }
        } catch (e) {}
    }, 3000);
}
        // ---- инициализация ----
        async function initAdmin() {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            const token = params.get('token');
            if (room && token) {
                document.getElementById('setupPanel').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                roomCodeSpan.textContent = room;
                // Подключаем WebSocket
                ws = connectWs(room, token, 'admin', onState, () => {
                    toast('Соединение потеряно, переподключаемся...', true);
                });
                startPolling();

                // Загрузим начальное состояние через REST (для подстраховки)
                try {
                    const data = await apiGet(`/api/games/${room}/state?token=${token}&role=admin`);
                    onState({ type: 'state', ...data });
                } catch(e) { toast('Ошибка загрузки состояния', true); }
                // Кнопки управления
                document.getElementById('startBtn').onclick = () => adminAction('/admin/start');
                document.getElementById('nextPhaseBtn').onclick = () => adminAction('/admin/next_phase');
                document.getElementById('resetBtn').onclick = () => {
                    if (confirm('Сбросить игру? Все данные будут удалены.')) {
                        adminAction('/admin/reset');
                    }
                };
                document.getElementById('applyScoreBtn').onclick = applyScores;
            } else {
                // Показываем форму создания/загрузки
                document.getElementById('setupPanel').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

        async function adminAction(path) {
            const room = roomCodeSpan.textContent;
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) return toast('Нет токена', true);
            try {
                await apiPost(`/api/games/${room}${path}`, { token });
            } catch(e) { toast('Ошибка: ' + e.message, true); }
        }

        // ---- обработка состояния ----
        function onState(state) {
            if (state.type !== 'state') return;
            gameState = state;
            render();
        }

        function render() {
            if (!gameState) return;
            const s = gameState;
            roundDisplay.textContent = s.round_number;
            totalRoundsDisplay.textContent = s.total_rounds;
            const phaseMap = { lobby: 'Ожидание', challenge: 'Космический вызов', upgrade: 'Техобслуживание', battle: 'Звёздная битва', finished: 'Игра завершена' };
            phaseBadge.textContent = phaseMap[s.phase] || s.phase;
            phaseBadge.className = 'phase-badge phase-' + s.phase;

            // Команды
            if (s.teams && s.teams.length) {
                let html = `<table class="team-table"><tr><th>Команда</th><th>Монеты</th><th>Атака</th><th>Защита</th><th>Разведка</th><th>Скрытность</th><th>Рейтинг</th></tr>`;
                s.teams.forEach(t => {
                    html += `<tr><td><strong>${t.name}</strong></td>
                        <td>${t.coins}</td>
                        <td>${t.attack}</td><td>${t.defense}</td>
                        <td>${t.scout}</td><td>${t.stealth}</td>
                        <td>${t.rating}</td></tr>`;
                });
                html += '</table>';
                teamsContainer.innerHTML = html;
            } else {
                teamsContainer.innerHTML = '<p class="muted">Нет команд</p>';
            }

            // Действия
            if (s.actions && s.actions.length) {
                let html = '';
                s.actions.forEach(a => {
                    const statusMap = { pending: '⏳ Ожидает', applied: '✅ Выполнено', rejected: '❌ Отклонено' };
                    html += `<div class="action-item">
                        <div><strong>${a.team_name}</strong> — ${ACTION_LABEL[a.action_type] || a.action_type}
                        ${a.target_name ? '➜ ' + a.target_name : ''}
                        ${a.module ? '🔧 ' + a.module : ''}
                        <span class="badge ${a.status}">${statusMap[a.status] || a.status}</span>
                        </div>
                        <div class="muted" style="font-size:.85rem;">${a.result_text || ''}</div>`;
                    if (a.status === 'pending') {
                        html += `<div class="action-buttons">
                            <button class="ok" onclick="confirmAction('${a.id}', true)">✅ Подтвердить</button>
                            <button class="danger" onclick="confirmAction('${a.id}', false)">❌ Отклонить</button>
                        </div>`;
                    }
                    html += '</div>';
                });
                actionsContainer.innerHTML = html;
            } else {
                actionsContainer.innerHTML = '<p class="muted">Нет действий</p>';
            }

            // История
            if (s.history && s.history.length) {
                historyContainer.innerHTML = s.history.slice().reverse().map(h => `<div>• ${h}</div>`).join('');
            } else {
                historyContainer.innerHTML = '<p class="muted">Пусто</p>';
            }

            // Форма начисления очков (только в фазе challenge)
            if (s.phase === 'challenge' && s.teams && s.teams.length) {
                scoreSection.style.display = 'block';
                let html = '';
                s.teams.forEach(t => {
                    html += `<div class="row" style="justify-content:space-between;">
                        <span>${t.name}</span>
                        <input type="number" class="score-input" data-team="${t.id}" value="0" min="0" max="20" />
                    </div>`;
                });
                scoreInputs.innerHTML = html;
            } else {
                scoreSection.style.display = 'none';
            }
        }

        // ---- подтверждение действий ----
        window.confirmAction = async (actionId, approve) => {
            const room = roomCodeSpan.textContent;
            const token = new URLSearchParams(window.location.search).get('token');
            try {
                await apiPost(`/api/games/${room}/admin/confirm_action`, { token, action_id: actionId, approve });
            } catch(e) { toast('Ошибка: ' + e.message, true); }
        };

        // ---- начисление очков ----
        async function applyScores() {
            const room = roomCodeSpan.textContent;
            const token = new URLSearchParams(window.location.search).get('token');
            const inputs = document.querySelectorAll('.score-input');
            const scores = {};
            inputs.forEach(inp => {
                const val = parseInt(inp.value);
                if (val > 0) scores[inp.dataset.team] = val;
            });
            if (Object.keys(scores).length === 0) {
                document.getElementById('scoreMsg').textContent = 'Введите хотя бы одно положительное значение';
                return;
            }
            try {
                await apiPost(`/api/games/${room}/admin/score`, { token, scores });
                document.getElementById('scoreMsg').textContent = '✅ Очки начислены!';
                inputs.forEach(inp => inp.value = '0');
            } catch(e) {
                document.getElementById('scoreMsg').textContent = '❌ ' + e.message;
            }
        }

        // ---- создание/загрузка ----
        document.getElementById('createGameBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/games', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ total_rounds: 5, max_teams: 6 })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                window.location.href = `/admin?room=${data.room_code}&token=${data.admin_token}`;
            } catch(e) {
                document.getElementById('adminMsg').textContent = '❌ ' + e.message;
            }
        });

        document.getElementById('loadGameBtn').addEventListener('click', () => {
            const room = document.getElementById('adminRoomInput').value.trim().toUpperCase();
            const token = document.getElementById('adminTokenInput').value.trim();
            if (!room || !token) {
                document.getElementById('adminMsg').textContent = '❌ Введите код и токен';
                return;
            }
            window.location.href = `/admin?room=${room}&token=${token}`;
        });

        initAdmin();
    </script>
</body>
</html>
